# MegaFS Default Configuration

# Model settings
swap_type: ftm  # Options: ftm, injection, lcr

# Dataset paths (can be overridden via arguments or env variables)
dataset_root: ./dataset/CelebAMask-HQ
img_root: ./dataset/CelebAMask-HQ/CelebA-HQ-img
mask_root: ./dataset/CelebAMask-HQ/CelebAMask-HQ-mask-anno
data_map_path: ./data_map.json

# Model weights
checkpoint_dir: ./weights

# Device configuration (auto-detected: cuda if available, else cpu)
device: cuda  # Options: cuda, cpu, auto

# Model architecture
model:
  size: 1024
  latent_split: [4, 6, 8]
  num_latents: 18
  swap_indice: 4
  num_blocks: 1

# Training/Experiment settings
experiment:
  enable_grads: false  # Set true for gradient-based experiments
  batch_size: 8
  num_workers: 4
  seed: 42

# Data split ratios
data_split:
  train: 0.7
  val: 0.15
  test: 0.15


